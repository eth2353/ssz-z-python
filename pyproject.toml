[build-system]
requires = ["setuptools>=77", "ziglang==0.16.0"]
build-backend = "setuptools.build_meta"

[project]
name = "ssz-z-python"
version = "0.2.0"
description = "Native Python bindings to Lodestar-Z SSZ consensus types"
readme = "README.md"
requires-python = ">=3.12"
dependencies = []
license = "Apache-2.0"
license-files = ["LICENSE", "licenses/*.txt"]
authors = [{name = "ssz-z-python contributors"}]
classifiers = [
    "Operating System :: MacOS :: MacOS X",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3",
    "Programming Language :: Zig",
    "Topic :: Software Development :: Libraries :: Python Modules",
]

[dependency-groups]
dev = [
    "mypy>=1",
    "pre-commit>=4",
    "pytest>=9",
    "pytest-cov>=6",
    "python-snappy>=0.7",
    "pyyaml>=6",
    "ruff>=0.11",
    "ziglang==0.16.0",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
ssz_z = ["py.typed"]

[tool.uv]
required-version = "~=0.13.5"
exclude-newer = "7 days"
build-constraint-dependencies = ["setuptools==82.0.1"]
# Let Zig track native inputs instead of duplicating its dependency graph here.
reinstall-package = ["ssz-z-python"]

[tool.pytest.ini_options]
strict = true
filterwarnings = ["error"]
testpaths = ["tests"]
pythonpath = ["."]
markers = ["spec: official consensus SSZ static vectors"]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["ALL"]
# Documentation and exception wording remain editorial decisions.
# COM812 conflicts with the formatter.
ignore = ["D", "EM", "TRY003", "COM812", "CPY001"]

[tool.ruff.lint.flake8-type-checking]
strict = true

[tool.ruff.lint.per-file-ignores]
# Internal codecs share private layouts and use Any for open-ended metadata.
# Tests use literal expected values, assertions, fixtures, and private helpers.
# Tools/tests/benchmarks are outside strict mypy coverage; annotations are optional.
# Security and complexity exceptions are documented at individual call sites.
"src/**" = ["SLF001"]
"src/ssz_z/beacon_api.py" = ["ANN401"]
"tests/**" = ["ANN", "PLR2004", "PT011", "S101", "SLF", "ARG", "INP", "PLC0415"]
"tools/**" = ["ANN", "INP001", "T201"]
"performance/**" = ["ANN", "INP001", "S101", "T201", "SLF001"]
"setup.py" = ["ANN"]
"main.py" = ["ANN", "S101", "T201"]

[tool.mypy]
python_version = "3.12"
strict = true
files = ["src", "tests/typing"]
