[build-system]
requires = ["setuptools>=77", "wheel", "ziglang==0.16.0"]
build-backend = "setuptools.build_meta"

[project]
name = "ssz-z-python"
version = "0.2.0"
description = "Native Python bindings to Lodestar-Z SSZ consensus types"
readme = "README.md"
requires-python = ">=3.12"
license = "Apache-2.0"
license-files = ["LICENSE", "licenses/*.txt"]
authors = [{name = "ssz-z-python contributors"}]
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Zig",
    "Topic :: Software Development :: Libraries :: Python Modules",
]

[project.optional-dependencies]
test = ["pytest>=8", "pyyaml>=6", "python-snappy>=0.7"]
dev = ["ssz-z-python[test]", "build>=1", "ruff>=0.11"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
ssz_z = ["py.typed", "_native/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["spec: official consensus SSZ static vectors"]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
