[build-system]
requires = ["setuptools>=77", "ziglang==0.16.0"]
build-backend = "setuptools.build_meta"

[project]
name = "ssz-z-python"
version = "0.2.0"
description = "Native Python bindings to Lodestar-Z SSZ consensus types"
readme = "README.md"
requires-python = ">=3.12"
dependencies = []
license = "Apache-2.0"
license-files = ["LICENSE", "licenses/*.txt"]
authors = [{name = "ssz-z-python contributors"}]
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Zig",
    "Topic :: Software Development :: Libraries :: Python Modules",
]

[dependency-groups]
dev = [
    "mypy>=1",
    "pre-commit>=4",
    "pytest>=8",
    "pytest-cov>=6",
    "python-snappy>=0.7",
    "pyyaml>=6",
    "ruff>=0.11",
    "ziglang==0.16.0",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
ssz_z = ["py.typed"]

[tool.uv]
required-version = "~=0.13.5"
exclude-newer = "7 days"
build-constraint-dependencies = ["setuptools==82.0.1"]
cache-keys = [
    { file = "pyproject.toml" },
    { file = "setup.py" },
    { file = "src/ssz_z/**/*.py" },
    { file = "MANIFEST.in" },
    { file = "build.zig" },
    { file = "native/*.zig" },
    { file = "native/*.h" },
    { file = "UPSTREAM.json" },
    { file = "tools/fetch_native.py" },
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
markers = ["spec: official consensus SSZ static vectors"]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.mypy]
strict = true
files = ["src", "tests/typing"]
