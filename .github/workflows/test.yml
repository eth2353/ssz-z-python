name: Bindings
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test:
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, ubuntu-24.04-arm]
        python: ['3.12', '3.15']
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install uv
        uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          activate-environment: true
          python-version: ${{ matrix.python }}
      - name: Resolve newest vector release
        id: vectors
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: echo "key=$(python -m tools.fetch_vectors --cache-key)" >> "$GITHUB_OUTPUT"
      - name: Cache official vectors
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: fixtures/releases
          key: ssz-vectors-${{ steps.vectors.outputs.key }}-${{ hashFiles('tools/extract_vectors.py', 'tools/fetch_vectors.py') }}
      - name: Run pytest
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          uv sync --locked
          uv run --locked pytest --cov=ssz_z --cov-report=term-missing
      - name: Check public types
        run: uv run --locked mypy
      - name: Build sdist and wheel
        run: uv build
      - name: Test installed wheel
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          uv pip install --python .venv/bin/python --no-deps --reinstall dist/*.whl
          # Do not let uv replace the wheel with the project's editable installation.
          uv run --no-sync pytest -q
